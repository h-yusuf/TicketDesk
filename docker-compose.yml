services:
  pocketbase:
    build:
      context: ./pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data
    environment:
      # All optional — unset means that integration's hook no-ops silently.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:-}
    restart: unless-stopped
    ports:
      - "8091:80"
    depends_on:
      - pocketbase

volumes:
  pb_data:
