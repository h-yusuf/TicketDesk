services:
  pocketbase:
    build:
      context: ./pocketbase
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pocketbase
      - web

volumes:
  pb_data:
  caddy_data:
  caddy_config:
