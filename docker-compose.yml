services:
  pocketbase:
    build:
      context: ./pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:-}
    restart: unless-stopped
    ports:
      - "8091:80"
    depends_on:
      - pocketbase

volumes:
  pb_data:
